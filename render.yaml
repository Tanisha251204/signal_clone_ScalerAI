# Render Blueprint — deploys the FastAPI backend (REST + WebSockets + SQLite).
# The Next.js frontend is deployed separately (Vercel); see README → Deployment.
services:
  - type: web
    name: signal-clone-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: CORS_ORIGINS
        sync: false            # set to your Vercel URL, e.g. https://signal-clone.vercel.app
      - key: SEED_DEMO_DATA
        value: "1"
      - key: FIXED_OTP
        value: "123456"
    # DATABASE: by default the app uses SQLite on the instance disk, which is EPHEMERAL on the free plan
    # (data resets on every redeploy/restart and the demo seed is re-created).
    # For a durable database kept OUTSIDE this service, add an env var in the Render dashboard (Environment tab):
    #   DATABASE_URL = <Neon / Supabase / any Postgres connection string>   (free Neon: https://neon.com)
    # The app detects the database type from this URL (postgres:// and postgresql:// both work). Do not commit it.
    # NOTE: uploaded attachments are still files on this disk (UPLOAD_DIR); they need object storage to be durable.
    # Alternative with a paid persistent disk:
    #   DATABASE_URL=sqlite:////var/data/signal.db   UPLOAD_DIR=/var/data/uploads
    # disk:
    #   name: data
    #   mountPath: /var/data
    #   sizeGB: 1
